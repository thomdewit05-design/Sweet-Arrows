name: TestFlight

# Builds a Release archive and uploads it to App Store Connect / TestFlight.
# Run it by hand: Actions → TestFlight → Run workflow.
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID            App Store Connect API key id
#   ASC_ISSUER_ID         App Store Connect issuer id
#   ASC_KEY_P8            the .p8 key file: open it in Notepad and paste everything,
#                         including the BEGIN/END lines (or ASC_KEY_P8_BASE64, base64-encoded)
#   DEVELOPMENT_TEAM      optional: overrides the team id in Config/Shared.xcconfig
#   SECRETS_XCCONFIG      contents of Config/Secrets.xcconfig (real AdMob ids)
#   GOOGLE_SERVICE_INFO   GoogleService-Info.plist, base64-encoded (optional)

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write secrets
        env:
          SECRETS_XCCONFIG: ${{ secrets.SECRETS_XCCONFIG }}
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          printf '%s\n' "$SECRETS_XCCONFIG" > Config/Secrets.xcconfig
          # The team id also lives in Config/Shared.xcconfig; the secret only overrides it.
          if [ -n "$DEVELOPMENT_TEAM" ]; then
            echo "DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM" >> Config/Secrets.xcconfig
          fi
          if [ -n "$GOOGLE_SERVICE_INFO" ]; then
            echo "$GOOGLE_SERVICE_INFO" | base64 --decode > SweetArrows/App/GoogleService-Info.plist
          fi
          mkdir -p ~/private_keys
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey.p8
          elif [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey.p8
          else
            echo "::error::Add the ASC_KEY_P8 secret (contents of your AuthKey .p8 file)"
            exit 1
          fi
          if ! grep -q "BEGIN PRIVATE KEY" ~/private_keys/AuthKey.p8; then
            echo "::error::ASC_KEY_P8 does not look like a .p8 key (missing BEGIN PRIVATE KEY)"
            exit 1
          fi
      - name: Generate project
        run: xcodegen generate
      - name: Revoke development certificates from earlier builds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography \
            || python3 -m pip install --quiet pyjwt cryptography
          python3 Tools/CI/revoke_ci_certificates.py
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SweetArrows.xcodeproj -scheme SweetArrows -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/SweetArrows.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} | tail -n 40
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/SweetArrows.xcarchive -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} | tail -n 40
      - name: Show Apple distribution log on failure
        if: failure()
        run: |
          for log in $(find "${TMPDIR:-/tmp}" -path "*xcdistributionlogs*" -name "*.log" 2>/dev/null); do
            echo "::group::$log"
            tail -n 80 "$log"
            echo "::endgroup::"
          done
