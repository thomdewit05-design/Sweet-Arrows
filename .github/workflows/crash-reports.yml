name: Crash reports

# Prints the crash reports TestFlight testers shared (only the crash itself, no tester details).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/crash-reports.yml

jobs:
  crashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared crash reports
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.lucthomasdewit.sweetarrows.com
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey.p8
          python3 -m pip install --quiet pyjwt cryptography
          python3 Tools/CI/crash_reports.py
