name: App Store screenshots

# Makes the App Store screenshots (Dutch and English) on the largest iPhone simulator from the demo
# account, and commits the raw PNGs to docs/appstore/raw on the branch it ran on.
# Tools/AppStore/frame_screenshots.py then adds the headlines.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/screenshots.yml
      - SweetArrowsUITests/ScreenshotTests.swift
      - SweetArrows/App/Demo.swift

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick the largest iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(p) for p in k.split("iOS-")[-1].split("-")])
          for runtime in reversed(ios):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone") and "Pro Max" in d["name"]]
              if phones:
                  print(sorted(phones, key=lambda d: d["name"])[-1]["udid"]); break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
      - name: Take screenshots
        run: |
          set -o pipefail
          TEST_RUNNER_SCREENSHOTS=1 xcodebuild test \
            -project SweetArrows.xcodeproj -scheme SweetArrows \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:SweetArrowsUITests/ScreenshotTests \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | grep -E "error:|Test Case|\*\* TEST" || true
          ls -la ~/appstore-shots
      - uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: ~/appstore-shots
      - name: Commit the screenshots
        run: |
          mkdir -p docs/appstore/raw
          cp ~/appstore-shots/*.png docs/appstore/raw/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appstore/raw
          git commit -m "App Store screenshots (raw) [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
