# XcodeGen project. Generate the Xcode project with:  xcodegen generate
# Never edit SweetArrows.xcodeproj by hand: it is rebuilt from this file.
name: SweetArrows

options:
  bundleIdPrefix: com.lucthomasdewit
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  SweetArrowsCore:
    path: Packages/SweetArrowsCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "3.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  SweetArrows:
    type: application
    platform: iOS
    sources:
      - path: SweetArrows
        excludes:
          - "App/SweetArrows.entitlements"
    dependencies:
      - package: SweetArrowsCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      # Needed by Google Mobile Ads when linked with -ObjC.
      - sdk: JavaScriptCore.framework
    info:
      path: SweetArrows/App/Info.plist
      properties:
        CFBundleDisplayName: Sweet Arrows
        # Without these XcodeGen writes a fixed "1.0" / "1", and every TestFlight upload after the first fails.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nl, de, fr, es, pt-BR, tr, id]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.puzzle-games
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
          UIImageRespectsSafeAreaInsets: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Fredoka-Medium.ttf, Fredoka-SemiBold.ttf, Fredoka-Bold.ttf]
        GADApplicationIdentifier: $(GAD_APPLICATION_ID)
        SAAdUnitRewarded: $(AD_UNIT_REWARDED)
        SAAdUnitInterstitial: $(AD_UNIT_INTERSTITIAL)
        SAAdUnitBanner: $(AD_UNIT_BANNER)
        SAAdUnitAppOpen: $(AD_UNIT_APP_OPEN)
        NSUserTrackingUsageDescription: "Sweet Arrows uses this to show you more relevant ads. The game stays fully playable either way."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SWEETARROWS_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SweetArrows/App/SweetArrows.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    postBuildScripts:
      - name: Crashlytics dSYM upload
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          # Only for Release builds that include a GoogleService-Info.plist.
          if [ "${CONFIGURATION}" != "Release" ] || [ ! -f "${SRCROOT}/SweetArrows/App/GoogleService-Info.plist" ]; then
            exit 0
          fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if [ "${CI}" = "true" ]; then exit 0; fi
          if which swiftlint > /dev/null; then
            swiftlint --quiet
          else
            echo "warning: SwiftLint is not installed (brew install swiftlint)"
          fi

  SweetArrowsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SweetArrowsTests]
    dependencies:
      - target: SweetArrows
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SWEETARROWS_BUNDLE_ID).tests

  SweetArrowsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SweetArrowsUITests]
    dependencies:
      - target: SweetArrows
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SWEETARROWS_BUNDLE_ID).uitests

schemes:
  SweetArrows:
    build:
      targets:
        SweetArrows: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [SweetArrows]
      targets:
        - SweetArrowsTests
        - SweetArrowsUITests
    archive:
      config: Release
